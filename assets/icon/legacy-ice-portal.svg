<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="frostfireinstaller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123A66"/>
      <stop offset="1" stop-color="#081B33"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FCFF"/>
      <stop offset="1" stop-color="#9BDCFF"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#EAFDFF"/>
      <stop offset="0.45" stop-color="#74D8FF"/>
      <stop offset="1" stop-color="#2E8FD6"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FE8FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8FE8FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portalClip">
      <path d="M360 792 L360 500 A152 152 0 0 1 664 500 L664 792 Z"/>
    </clipPath>
    <g id="flakeArm" fill="none" stroke="#EAF9FF" stroke-width="24" stroke-linecap="round">
      <line x1="512" y1="512" x2="512" y2="248"/>
      <line x1="512" y1="356" x2="446" y2="312"/>
      <line x1="512" y1="356" x2="578" y2="312"/>
      <line x1="512" y1="296" x2="464" y2="260"/>
      <line x1="512" y1="296" x2="560" y2="260"/>
    </g>
    <g id="snowflake">
      <use href="#flakeArm"/>
      <use href="#flakeArm" transform="rotate(60 512 512)"/>
      <use href="#flakeArm" transform="rotate(120 512 512)"/>
      <use href="#flakeArm" transform="rotate(180 512 512)"/>
      <use href="#flakeArm" transform="rotate(240 512 512)"/>
      <use href="#flakeArm" transform="rotate(300 512 512)"/>
    </g>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- large background snowflake -->
  <g opacity="0.16" transform="translate(512 452) scale(1.24) translate(-512 -512)">
    <use href="#snowflake"/>
  </g>

  <!-- portal glow -->
  <circle cx="512" cy="560" r="330" fill="url(#glow)"/>

  <!-- gateway arch (ice) -->
  <path d="M328 812 L328 500 A184 184 0 0 1 696 500 L696 812 Z" fill="url(#ice)"/>
  <!-- portal opening -->
  <path d="M360 792 L360 500 A152 152 0 0 1 664 500 L664 792 Z" fill="url(#portal)"/>

  <!-- swirl inside portal -->
  <g clip-path="url(#portalClip)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M356 704 C 470 616, 556 772, 668 664" stroke-width="30" opacity="0.45"/>
    <path d="M356 616 C 476 532, 540 664, 668 572" stroke-width="20" opacity="0.35"/>
  </g>

  <!-- centre snowflake -->
  <g transform="translate(512 636) scale(0.58) translate(-512 -512)">
    <use href="#snowflake" stroke="#FFFFFF"/>
  </g>

  <!-- icicles hanging from the arch over the opening -->
  <g fill="#E8FAFF">
    <path d="M420 350 L434 452 L448 350 Z"/>
    <path d="M486 348 L500 480 L514 348 Z"/>
    <path d="M552 350 L566 452 L580 350 Z"/>
  </g>

  <!-- snow ground -->
  <path d="M96 884 C 260 824, 380 902, 512 902 C 644 902, 764 824, 928 884 L928 1024 L96 1024 Z" fill="#EAF9FF"/>
  <path d="M96 934 C 300 886, 724 886, 928 934 L928 1024 L96 1024 Z" fill="#CDEBFF"/>
</svg>
