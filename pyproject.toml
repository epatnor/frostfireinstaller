[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "frostylauncher"
version = "0.1.0"
description = "A Battle.net installer helper for Linux (umu-launcher + Proton)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "frostylauncher contributors" }]
keywords = ["blizzard", "battlenet", "wow", "wine", "proton", "umu", "linux", "launcher"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.42"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
frostylauncher = "frostylauncher.cli:main"
frostylauncher-gui = "frostylauncher.gui:main"

[project.urls]
Homepage = "https://github.com/OWNER/frostylauncher"
Repository = "https://github.com/OWNER/frostylauncher"
Issues = "https://github.com/OWNER/frostylauncher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frostylauncher"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
files = ["src/frostylauncher"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
